# =============================================================================
# Traefik v3 - Dynamic Configuration (Hot-Reload)
# File: traefik/dynamic.yml
# =============================================================================
# Cấu hình động — Traefik tự reload khi file này thay đổi (không cần restart).
# Định nghĩa:
#   • Middlewares: security-headers, global-ratelimit, request-id, inject-gateway-secret
#   • Routers & Services cho 6 Microservices (Database-per-Service Architecture)
#   • TLS options (TLS 1.2 / TLS 1.3)
# =============================================================================

http:
  middlewares:
    # ── 1. Security Headers ──────────────────────────────────────────────────
    security-headers:
      headers:
        stsSeconds: 31536000 # [SEC-22] 1-year HSTS
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        browserXssFilter: true
        frameDeny: true
        referrerPolicy: "strict-origin-when-cross-origin"
        permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=()"
        customResponseHeaders:
          X-Powered-By: ""
          Server: ""

    # ── 2. Global Rate Limiting ───────────────────────────────────────────────
    global-ratelimit:
      rateLimit:
        average: 100
        burst: 200
        sourceCriterion:
          ipStrategy:
            depth: 0 # [SEC-03] Direct client TCP RemoteAddr (depth: 0) to prevent X-Forwarded-For spoofing

    # ── 3. Request ID Injection ────────────────────────────────────────────────
    request-id:
      headers:
        customResponseHeaders:
          X-Gateway: "Traefik-v3" # Traefik tự sinh UUIDv4 nếu client chưa gửi

    # ── 4. Gateway Secret Injection ───────────────────────────────────────────
    # Được inject động thông qua scripts/sync-traefik-config.js hoặc Docker labels
    inject-gateway-secret:
      headers:
        customRequestHeaders:
          X-Gateway: "Traefik-v3"
          X-Gateway-Secret: "7rr7RqFb3SgzU38ysHYS8dnbqrO2zT41" # [SEC-04] Default sync target

    # ── 5. Compress Response ──────────────────────────────────────────────────
    compress-response:
      compress:
        minResponseBodyBytes: 1024

    # ── 6. CORS Headers [SEC-11] ──────────────────────────────────────────────
    cors-headers:
      headers:
        accessControlAllowCredentials: true
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - "Content-Type"
          - "Authorization"
          - "X-Requested-With"
          - "Accept"
          - "Origin"
          - "X-Request-Id"
          - "X-Client-Version"
          - "X-Gateway-Secret"
          - "Range"
          - "Cache-Control"
          - "Pragma"
          - "Expires"
        accessControlAllowOriginList:
          - "http://localhost:3000"
          - "http://127.0.0.1:3000"
          - "http://localhost:5173"
        accessControlAllowCredentials: true
        accessControlMaxAge: 3600
        addVaryHeader: true

  # ── Routers & Services (Định tuyến 6 Microservices PPE Monitoring) ─────────
  routers:
    # 1. Site Service (:8891)
    sites:
      rule: "PathPrefix(`/api/v1/sites`) || PathPrefix(`/api/v1/zones`) || PathPrefix(`/api/v1/restricted-areas`) || PathPrefix(`/api/v1/safety-rules`)"
      entryPoints:
        - web
      service: site-service
      priority: 100
      middlewares:
        - cors-headers
        - security-headers
        - global-ratelimit
        - request-id
        - inject-gateway-secret

    # 2. Camera Service (:8892)
    cameras:
      rule: "PathPrefix(`/api/v1/cameras`) || PathPrefix(`/api/v1/camera-streams`)"
      entryPoints:
        - web
      service: camera-service
      priority: 100
      middlewares:
        - cors-headers
        - security-headers
        - global-ratelimit
        - request-id
        - inject-gateway-secret

    # 3. Incident Service (:8893)
    incidents:
      rule: "PathPrefix(`/api/v1/incidents`) || PathPrefix(`/api/v1/evidences`)"
      entryPoints:
        - web
      service: incident-service
      priority: 100
      middlewares:
        - cors-headers
        - security-headers
        - global-ratelimit
        - request-id
        - inject-gateway-secret

    # 4. Notification Service (:8889)
    notifications:
      rule: "PathPrefix(`/api/v1/notifications`)"
      entryPoints:
        - web
      service: notification-service
      priority: 100
      middlewares:
        - cors-headers
        - security-headers
        - global-ratelimit
        - request-id
        - inject-gateway-secret

    # 5. Reporting Service (:8894)
    reporting:
      rule: "PathPrefix(`/api/v1/reports`) || PathPrefix(`/api/v1/statistics`) || PathPrefix(`/api/v1/ai-models`)"
      entryPoints:
        - web
      service: reporting-service
      priority: 100
      middlewares:
        - cors-headers
        - security-headers
        - global-ratelimit
        - request-id
        - inject-gateway-secret

    # 6. Media / Storage Service (:8890)
    media:
      rule: "PathPrefix(`/api/v1/files`)"
      entryPoints:
        - web
      service: media-service
      priority: 100
      middlewares:
        - cors-headers
        - security-headers
        - global-ratelimit
        - request-id
        - inject-gateway-secret

    # 7. Identity & Core API Catch-All (:9999) - Auth, Users, RBAC, System, Docs, Health
    app-api:
      rule: "PathPrefix(`/api/v1`) || PathPrefix(`/.well-known`) || PathPrefix(`/api/docs`)"
      entryPoints:
        - web
      service: app-api
      priority: 1
      middlewares:
        - cors-headers
        - security-headers
        - global-ratelimit
        - request-id
        - inject-gateway-secret

  # ── Servers Transports [SEC-12] ───────────────────────────────────────────
  serversTransports:
    streaming-transport:
      forwardingTimeouts:
        responseHeaderTimeout: 0s
        idleConnTimeout: 0s

  # ── Load Balancers & Backend Destinations ─────────────────────────────────
  services:
    site-service:
      loadBalancer:
        servers:
          - url: "http://site-service:8891"

    camera-service:
      loadBalancer:
        serversTransport: streaming-transport
        responseForwarding:
          flushInterval: "100ms"
        servers:
          - url: "http://camera-service:8892"

    incident-service:
      loadBalancer:
        servers:
          - url: "http://incident-service:8893"

    notification-service:
      loadBalancer:
        serversTransport: streaming-transport
        responseForwarding:
          flushInterval: "100ms"
        servers:
          - url: "http://notification-service:8889"

    reporting-service:
      loadBalancer:
        servers:
          - url: "http://reporting-service:8894"

    media-service:
      loadBalancer:
        servers:
          - url: "http://media-service:8890"

    app-api:
      loadBalancer:
        servers:
          - url: "http://identity-service:9999"

# ── TLS Options ──────────────────────────────────────────────────────────────
tls:
  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
    modern:
      minVersion: VersionTLS13
