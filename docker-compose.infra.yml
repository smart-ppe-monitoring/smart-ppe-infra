# =============================================================================
# SMART PPE MICROSERVICES: HẠ TẦNG DÙNG CHUNG (INFRASTRUCTURE BACKBONE)
# =============================================================================
# Quản lý 6 dịch vụ hạ tầng cốt lõi cho toàn bộ kiến trúc microservices:
#   1. PostgreSQL 16 (6 Logical Databases độc lập) - Cổng 5433:5432
#   2. Redis 7 Alpine (Cache, SSE sessions, BullMQ) - Cổng 6379:6379
#   3. Apache Kafka KRaft (Event Broker, Zero Zookeeper) - Cổng 9092:9092
#   4. Kafka UI (Giao diện trực quan xem topics & messages) - Cổng 8088:8080
#   5. MinIO (S3-compatible Object Storage cho ảnh/video) - Cổng 9000-9001
#   6. Traefik v3 (API Gateway & Reverse Proxy) - Cổng 80, 8080
# =============================================================================

networks:
  ppe_infra_net:
    name: ppe_infra_net
    driver: bridge

volumes:
  ppe_pgdata:
    driver: local
  ppe_kafka_data:
    driver: local
  ppe_minio_data:
    driver: local
  ppe_redis_data:
    driver: local

services:
  # ── 1. PostgreSQL 16 (6 Logical Databases) ──────────────────────────────────
  ppe-postgres:
    image: postgres:16-alpine
    container_name: ppe_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PPE_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${PPE_POSTGRES_PASSWORD:-postgres_master_dev}
      TZ: "Asia/Ho_Chi_Minh"
    ports:
      - "${PPE_POSTGRES_PORT:-5433}:5432"
    volumes:
      - ppe_pgdata:/var/lib/postgresql/data
      - ./scripts/init-multiple-dbs.sql:/docker-entrypoint-initdb.d/01-init-multiple-dbs.sql:ro
      - ./scripts/init-uuidv7.sql:/docker-entrypoint-initdb.d/02-init-uuidv7.sql:ro
    networks:
      - ppe_infra_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PPE_POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── 2. Redis 7 (Cache, Dynamic Invalidation & SSE Session) ──────────────────
  redis:
    image: redis:7-alpine
    container_name: app_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ppe_redis_data:/data
    networks:
      - ppe_infra_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── 3. Apache Kafka: Event Bus (KRaft Mode - Zero Zookeeper) ───────────────
  ppe-kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ppe_kafka
    restart: unless-stopped
    ports:
      - "${PPE_KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@ppe-kafka:29093"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://ppe-kafka:29092,PLAINTEXT_HOST://localhost:${PPE_KAFKA_PORT:-9092}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - ppe_kafka_data:/var/lib/kafka/data
    networks:
      - ppe_infra_net
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── 4. Kafka UI Console ────────────────────────────────────────────────────
  ppe-kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ppe_kafka_ui
    restart: unless-stopped
    ports:
      - "${PPE_KAFKA_UI_PORT:-8088}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "ppe-local-cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "ppe-kafka:29092"
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      ppe-kafka:
        condition: service_healthy
    networks:
      - ppe_infra_net

  # ── 5. MinIO Object Storage (Evidence Snapshots & Videos) ───────────────────
  ppe-minio:
    image: minio/minio:latest
    container_name: ppe_minio
    restart: unless-stopped
    ports:
      - "${PPE_MINIO_API_PORT:-9000}:9000"
      - "${PPE_MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${PPE_MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${PPE_MINIO_ROOT_PASSWORD:-minio_admin_secret}
    command: server /data --console-address ":9001"
    volumes:
      - ppe_minio_data:/data
    networks:
      - ppe_infra_net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── 6. Traefik v3 API Gateway ───────────────────────────────────────────────
  traefik:
    image: traefik:v3.3
    container_name: app_gateway
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--ping=true"
    ports:
      - "80:80"
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    environment:
      GATEWAY_INTERNAL_SECRET: "${GATEWAY_INTERNAL_SECRET:-ppe_gateway_internal_secret_change_in_production_32char}"
    networks:
      - ppe_infra_net
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
