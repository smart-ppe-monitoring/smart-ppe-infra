# =============================================================================
# Development Override — docker-compose.dev.yml
# Dùng lệnh: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# =============================================================================
# Override dành riêng cho local dev:
#   • Traefik dashboard expose tại http://localhost:8080 (loopback)
#   • Log level DEBUG cho Traefik Gateway
#   • Cấu hình network chuẩn hóa ppe_infra_net (SEC-26)
#   • Redis expose ra localhost để debug với RedisInsight / CLI
# =============================================================================

services:
  traefik:
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--log.level=DEBUG"
      - "--accesslog=true"
      - "--ping=true"
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./traefik/traefik.dev.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro

  ppe-redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
