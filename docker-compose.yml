# =============================================================================
# SMART PPE MONITORING - FULL SYSTEM DOCKER COMPOSE
# =============================================================================
# Chạy 100% toàn bộ hệ thống từ thư mục smart-ppe-infra:
#   docker compose up -d --build
#
# Với chính sách 'restart: unless-stopped', sau khi chạy lệnh trên 1 lần,
# từ lần sau mỗi khi MỞ DOCKER DESKTOP, toàn bộ 13 container sẽ TỰ ĐỘNG CHẠY!
# =============================================================================

networks:
  ppe_infra_net:
    name: ppe_infra_net
    driver: bridge

volumes:
  ppe_pgdata:
    driver: local
  ppe_kafka_data:
    driver: local
  ppe_minio_data:
    driver: local
  ppe_redis_data:
    driver: local

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # TẦNG 1: HẠ TẦNG DÙNG CHUNG (INFRASTRUCTURE BACKBONE)
  # ─────────────────────────────────────────────────────────────────────────────

  # ── 1. PostgreSQL 16 (6 Logical Databases) ──────────────────────────────────
  ppe-postgres:
    image: postgres:16-alpine
    container_name: ppe_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PPE_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${PPE_POSTGRES_PASSWORD:-postgres_master_dev}
      TZ: "Asia/Ho_Chi_Minh"
    ports:
      - "${PPE_POSTGRES_PORT:-5433}:5432"
    volumes:
      - ppe_pgdata:/var/lib/postgresql/data
      - ./scripts/init-multiple-dbs.sql:/docker-entrypoint-initdb.d/01-init-multiple-dbs.sql:ro
      - ./scripts/init-uuidv7.sql:/docker-entrypoint-initdb.d/02-init-uuidv7.sql:ro
    networks:
      - ppe_infra_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PPE_POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── 2. Redis 7 (Cache, Dynamic Invalidation & SSE Session) ──────────────────
  ppe-redis:
    image: redis:7-alpine
    container_name: app_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ppe_redis_data:/data
    networks:
      - ppe_infra_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── 3. Apache Kafka: Event Bus (KRaft Mode - Zero Zookeeper) ───────────────
  ppe-kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ppe_kafka
    restart: unless-stopped
    ports:
      - "${PPE_KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@ppe-kafka:29093"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://ppe-kafka:29092,PLAINTEXT_HOST://localhost:${PPE_KAFKA_PORT:-9092}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - ppe_kafka_data:/var/lib/kafka/data
    networks:
      - ppe_infra_net
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── 4. Kafka UI Console ────────────────────────────────────────────────────
  ppe-kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ppe_kafka_ui
    restart: unless-stopped
    ports:
      - "${PPE_KAFKA_UI_PORT:-8088}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "ppe-local-cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "ppe-kafka:29092"
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      ppe-kafka:
        condition: service_healthy
    networks:
      - ppe_infra_net

  # ── 5. MinIO Object Storage (Evidence Snapshots & Videos) ───────────────────
  ppe-minio:
    image: minio/minio:latest
    container_name: ppe_minio
    restart: unless-stopped
    ports:
      - "${PPE_MINIO_API_PORT:-9000}:9000"
      - "${PPE_MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${PPE_MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${PPE_MINIO_ROOT_PASSWORD:-minio_admin_secret}
    command: server /data --console-address ":9001"
    volumes:
      - ppe_minio_data:/data
    networks:
      - ppe_infra_net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── 6. Traefik v3 API Gateway & Ingress ─────────────────────────────────────
  traefik:
    image: traefik:v3.3
    container_name: app_gateway
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--ping=true"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - ppe_infra_net
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─────────────────────────────────────────────────────────────────────────────
  # TẦNG 2: 7 BACKEND MICROSERVICES NODE.JS
  # ─────────────────────────────────────────────────────────────────────────────

  # ── 7. Identity Service (:9999) ────────────────────────────────────────────
  identity-service:
    build:
      context: ../smart-ppe-identity-service
      dockerfile: Dockerfile
    container_name: identity_service
    restart: unless-stopped
    ports:
      - "9999:9999"
    env_file:
      - ../smart-ppe-identity-service/.env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=9999
      - IDENTITY_DATABASE_URL=postgresql://ppe_identity_user:ppe_identity_dev_pass@ppe-postgres:5432/ppe_identity_db?schema=public
      - REDIS_HOST=app_redis
      - REDIS_PORT=6379
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET:-7rr7RqFb3SgzU38ysHYS8dnbqrO2zT41}
      - TRUST_PROXY=1
    depends_on:
      ppe-postgres:
        condition: service_healthy
      ppe-redis:
        condition: service_healthy
    networks:
      - ppe_infra_net

  # ── 8. Site Service (:8891) ────────────────────────────────────────────────
  site-service:
    build:
      context: ../smart-ppe-site-service
      dockerfile: Dockerfile
    container_name: site_service
    restart: unless-stopped
    ports:
      - "8891:8891"
    env_file:
      - ../smart-ppe-site-service/.env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=8891
      - SITE_PORT=8891
      - SITE_DATABASE_URL=postgresql://ppe_site_user:ppe_site_dev_pass@ppe-postgres:5432/ppe_site_db?schema=public
      - AUTH_JWKS_URL=http://identity-service:9999/.well-known/jwks.json
      - REDIS_HOST=app_redis
      - REDIS_PORT=6379
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET:-7rr7RqFb3SgzU38ysHYS8dnbqrO2zT41}
      - TRUST_PROXY=1
    depends_on:
      ppe-postgres:
        condition: service_healthy
      identity-service:
        condition: service_started
    networks:
      - ppe_infra_net

  # ── 9. Camera Service (:8892) ──────────────────────────────────────────────
  camera-service:
    build:
      context: ../smart-ppe-camera-service
      dockerfile: Dockerfile
    container_name: camera_service
    restart: unless-stopped
    ports:
      - "8892:8892"
    env_file:
      - ../smart-ppe-camera-service/.env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=8892
      - CAMERA_PORT=8892
      - CAMERA_DATABASE_URL=postgresql://ppe_camera_user:ppe_camera_dev_pass@ppe-postgres:5432/ppe_camera_db?schema=public
      - AUTH_JWKS_URL=http://identity-service:9999/.well-known/jwks.json
      - REDIS_HOST=app_redis
      - REDIS_PORT=6379
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET:-7rr7RqFb3SgzU38ysHYS8dnbqrO2zT41}
      - TRUST_PROXY=1
    depends_on:
      ppe-postgres:
        condition: service_healthy
      identity-service:
        condition: service_started
    networks:
      - ppe_infra_net

  # ── 10. Incident Service (:8893) ───────────────────────────────────────────
  incident-service:
    build:
      context: ../smart-ppe-incident-service
      dockerfile: Dockerfile
    container_name: incident_service
    restart: unless-stopped
    ports:
      - "8893:8893"
    env_file:
      - ../smart-ppe-incident-service/.env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=8893
      - INCIDENT_PORT=8893
      - INCIDENT_DATABASE_URL=postgresql://ppe_incident_user:ppe_incident_dev_pass@ppe-postgres:5432/ppe_incident_db?schema=public
      - AUTH_JWKS_URL=http://identity-service:9999/.well-known/jwks.json
      - REDIS_HOST=app_redis
      - REDIS_PORT=6379
      - PPE_KAFKA_BROKERS=ppe-kafka:29092
      - MINIO_ENDPOINT=ppe-minio
      - MINIO_PORT=9000
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET:-7rr7RqFb3SgzU38ysHYS8dnbqrO2zT41}
      - TRUST_PROXY=1
    depends_on:
      ppe-postgres:
        condition: service_healthy
      ppe-kafka:
        condition: service_healthy
      identity-service:
        condition: service_started
    networks:
      - ppe_infra_net

  # ── 11. Media Service (:8890) ──────────────────────────────────────────────
  media-service:
    build:
      context: ../smart-ppe-media-service
      dockerfile: Dockerfile
    container_name: media_service
    restart: unless-stopped
    ports:
      - "8890:8890"
    env_file:
      - ../smart-ppe-media-service/.env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=8890
      - MEDIA_PORT=8890
      - MEDIA_DATABASE_URL=postgresql://ppe_media_user:ppe_media_dev_pass@ppe-postgres:5432/ppe_media_db?schema=public
      - AUTH_JWKS_URL=http://identity-service:9999/.well-known/jwks.json
      - REDIS_HOST=app_redis
      - REDIS_PORT=6379
      - S3_ENDPOINT=ppe-minio
      - S3_PORT=9000
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET:-7rr7RqFb3SgzU38ysHYS8dnbqrO2zT41}
      - TRUST_PROXY=1
    depends_on:
      ppe-postgres:
        condition: service_healthy
      identity-service:
        condition: service_started
    networks:
      - ppe_infra_net

  # ── 12. Reporting Service (:8894) ──────────────────────────────────────────
  reporting-service:
    build:
      context: ../smart-ppe-reporting-service
      dockerfile: Dockerfile
    container_name: reporting_service
    restart: unless-stopped
    ports:
      - "8894:8894"
    env_file:
      - ../smart-ppe-reporting-service/.env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=8894
      - REPORTING_PORT=8894
      - REPORTING_DATABASE_URL=postgresql://ppe_reporting_user:ppe_reporting_dev_pass@ppe-postgres:5432/ppe_reporting_db?schema=public
      - AUTH_JWKS_URL=http://identity-service:9999/.well-known/jwks.json
      - REDIS_HOST=app_redis
      - REDIS_PORT=6379
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET:-7rr7RqFb3SgzU38ysHYS8dnbqrO2zT41}
      - TRUST_PROXY=1
    depends_on:
      ppe-postgres:
        condition: service_healthy
      identity-service:
        condition: service_started
    networks:
      - ppe_infra_net

  # ── 13. Notification Service (:8889) ───────────────────────────────────────
  notification-service:
    build:
      context: ../smart-ppe-notification-service
      dockerfile: Dockerfile
    container_name: notification_service
    restart: unless-stopped
    ports:
      - "8889:8889"
    env_file:
      - ../smart-ppe-notification-service/.env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=8889
      - NOTIFICATION_PORT=8889
      - NOTIFICATION_DATABASE_URL=postgresql://ppe_notification_user:ppe_notification_dev_pass@ppe-postgres:5432/ppe_notification_db?schema=public
      - AUTH_JWKS_URL=http://identity-service:9999/.well-known/jwks.json
      - REDIS_HOST=app_redis
      - REDIS_PORT=6379
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET:-7rr7RqFb3SgzU38ysHYS8dnbqrO2zT41}
      - TRUST_PROXY=1
    depends_on:
      ppe-postgres:
        condition: service_healthy
      ppe-redis:
        condition: service_healthy
      identity-service:
        condition: service_started
    networks:
      - ppe_infra_net
